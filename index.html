<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente PWM — Llenado de Plantilla</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{--slate:#1F2937;--slate2:#374151;--orange:#E8720C;--orange2:#F59E0B;--bg:#ECEFF3;--panel:#FFFFFF;--txt:#1F2937;--mut:#6B7280;--line:#E5E7EB;--ok:#10B981}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--slate);display:flex;justify-content:center;align-items:stretch}
  #app{width:100%;max-width:480px;background:var(--bg);display:flex;flex-direction:column;height:100dvh;position:relative;box-shadow:0 0 40px rgba(0,0,0,.4)}
  @media(min-width:520px){body{align-items:center;padding:20px 0}#app{height:calc(100dvh - 40px);border-radius:28px;overflow:hidden;border:1px solid #111827}}
  /* Header estilo app */
  header{background:linear-gradient(135deg,var(--slate) 0%,#111827 100%);color:#fff;padding:14px 16px calc(14px + 8px);position:relative;z-index:5}
  header .hrow{display:flex;align-items:center;gap:12px}
  #logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--orange2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.5px;box-shadow:0 4px 12px rgba(232,114,12,.45);flex-shrink:0}
  header h1{font-size:16px;font-weight:700}
  header .sub{color:#9CA3AF;font-size:11px;margin-top:1px}
  #menuBtn{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
  #menuPanel{display:none;margin-top:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;gap:8px;flex-wrap:wrap}
  #menuPanel.open{display:flex}
  #menuPanel button{flex:1 1 45%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px;border-radius:10px;font-size:12px;cursor:pointer;font-weight:600}
  #menuPanel button:active{background:var(--orange)}
  #progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.12)}
  #progressBar{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));width:0%;transition:width .4s;border-radius:0 4px 4px 0}
  /* Chat */
  #chat{flex:1;overflow-y:auto;padding:16px 14px 12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
  .msg{max-width:82%;padding:10px 14px;line-height:1.45;font-size:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.08);animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bot{background:var(--panel);color:var(--txt);border-radius:4px 18px 18px 18px;align-self:flex-start;border:1px solid var(--line)}
  .user{background:linear-gradient(135deg,var(--orange),#D97706);color:#fff;border-radius:18px 4px 18px 18px;align-self:flex-end}
  .sys{align-self:center;background:#DDE3EA;color:var(--mut);font-size:11px;padding:5px 12px;border-radius:12px;box-shadow:none;max-width:92%;text-align:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start;max-width:95%;animation:pop .18s ease-out}
  .chip{background:var(--panel);border:1.5px solid var(--orange);color:var(--orange);padding:8px 15px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .chip:active{background:var(--orange);color:#fff}
  .fieldtag{font-size:10px;color:var(--orange);margin-bottom:4px;display:block;font-weight:700;letter-spacing:.3px}
  /* Input bar flotante */
  footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:transparent}
  #inputRow{display:flex;gap:8px;background:var(--panel);border-radius:28px;padding:6px 6px 6px 18px;box-shadow:0 4px 16px rgba(0,0,0,.12);border:1px solid var(--line);align-items:center}
  #inp{flex:1;background:transparent;border:none;color:var(--txt);padding:10px 0;font-size:15px;outline:none;min-width:0}
  #send{background:linear-gradient(135deg,var(--orange),#D97706);border:none;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;flex-shrink:0;box-shadow:0 4px 10px rgba(232,114,12,.4)}
  #send:active{transform:scale(.93)}

  /* Splash de bienvenida */
  #splash{position:absolute;inset:0;background:linear-gradient(160deg,#111827 0%,var(--slate) 60%,#2d3a4f 100%);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s,visibility .6s}
  #splash.hide{opacity:0;visibility:hidden}
  #splashLogo{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--orange),var(--orange2));display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;letter-spacing:1px;box-shadow:0 12px 40px rgba(232,114,12,.5);animation:splashPop .8s cubic-bezier(.2,1.4,.4,1)}
  @keyframes splashPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  #splashName{color:#fff;font-size:22px;font-weight:700;letter-spacing:2px;animation:fadeUp .8s .3s both}
  #splashSub{color:#9CA3AF;font-size:12px;letter-spacing:3px;text-transform:uppercase;animation:fadeUp .8s .5s both}
  #splashBar{width:120px;height:3px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;animation:fadeUp .8s .6s both}
  #splashBarIn{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange2));animation:load 1.8s .4s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes load{to{width:100%}}
  /* Modo oscuro */
  body.dark #app{--bg:#111827;--panel:#1F2937;--txt:#F3F4F6;--mut:#9CA3AF;--line:#374151}
  body.dark .bot{border-color:var(--line)}
  body.dark .chip{background:#1F2937}
  body.dark .sys{background:#1F2937}
  body.dark #inputRow{box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #darkBtn{position:absolute}

</style>
</head>
<body>
<div id="app">
<div id="splash">
  <div id="splashLogo">PWM</div>
  <div id="splashName">PLATINUM</div>
  <div id="splashSub">Wealth Management</div>
  <div id="splashBar"><div id="splashBarIn"></div></div>
</div>
<header>
  <div class="hrow">
    <div id="logo">PWM</div>
    <div>
      <h1>Asistente PWM</h1>
      <div class="sub">Platinum Wealth Management · Estado Financiero</div>
    </div>
    <button id="menuBtn" title="Opciones">☰</button>
  </div>
  <div id="menuPanel">
    <button id="btnUpload">📂 Cargar otra plantilla</button>
    <button id="btnExcel">⬇️ Excel llenado</button>
    <button id="btnCSV">⬇️ CSV / JSON</button>
    <button id="btnPDF">📄 PDF Estado Financiero</button>
    <button id="btnDark">🌙 Modo oscuro</button>
  </div>
  <input type="file" id="fileInput" accept=".xlsx" style="display:none">
  <div id="progress"><div id="progressBar"></div></div>
</header>
<div id="chat"></div>
<footer>
  <div id="inputRow">
    <input id="inp" placeholder="Escribe tu respuesta…" autocomplete="off">
    <button id="send">➤</button>
  </div>
</footer>
</div>
<script>
/* ============ ESQUEMA DE CAMPOS (celdas amarillas de la plantilla) ============ */
/* type: text | number | money | date | pct | choice */
function F(sheet,cell,label,type,hint){return {sheet,cell,label,type:type||'text',hint:hint||''};}

const SECTIONS = [
{ id:'info', name:'1. Información Personal', fields:[
  F('Info Personal','F1','Código de cliente'),
  F('Info Personal','F2','Fecha (día/mes/año)','date'),
  // Titular
  F('Info Personal','C7','Titular — Nombres'),
  F('Info Personal','C8','Titular — Apellidos'),
  F('Info Personal','C9','Titular — Fecha de nacimiento','date'),
  F('Info Personal','C10','Titular — Estado civil','choice',['Soltero/a','Casado/a','Divorciado/a','Viudo/a','Unión libre']),
  F('Info Personal','C11','Titular — País de nacimiento'),
  F('Info Personal','C12','Titular — Nacionalidad'),
  F('Info Personal','C13','Titular — DUI','text','Formato 00000000-0'),
  F('Info Personal','C14','Titular — NIT','text','Formato 0000-000000-000-0'),
  F('Info Personal','G7','Titular — Profesión'),
  F('Info Personal','G8','Titular — Empleador'),
  F('Info Personal','G9','Titular — Nombre del puesto'),
  F('Info Personal','G10','Titular — Teléfono casa'),
  F('Info Personal','G11','Titular — Teléfono oficina'),
  F('Info Personal','G12','Titular — Teléfono celular'),
  F('Info Personal','G13','Titular — Correo electrónico'),
  F('Info Personal','G14','Titular — Sexo','choice',['M','F']),
]},
{ id:'conyuge', name:'2. Cónyuge (opcional)', skippable:true, fields:[
  F('Info Personal','C18','Cónyuge — Nombres'),
  F('Info Personal','C19','Cónyuge — Apellidos'),
  F('Info Personal','C20','Cónyuge — Fecha de nacimiento','date'),
  F('Info Personal','C21','Cónyuge — Estado civil','choice',['Soltero/a','Casado/a','Divorciado/a','Viudo/a','Unión libre']),
  F('Info Personal','C22','Cónyuge — País de nacimiento'),
  F('Info Personal','C23','Cónyuge — Nacionalidad'),
  F('Info Personal','C24','Cónyuge — DUI'),
  F('Info Personal','C25','Cónyuge — NIT'),
  F('Info Personal','G18','Cónyuge — Profesión'),
  F('Info Personal','G19','Cónyuge — Empleador'),
  F('Info Personal','G20','Cónyuge — Nombre del puesto'),
  F('Info Personal','G21','Cónyuge — Teléfono casa'),
  F('Info Personal','G22','Cónyuge — Teléfono oficina'),
  F('Info Personal','G23','Cónyuge — Teléfono celular'),
  F('Info Personal','G24','Cónyuge — Correo electrónico'),
  F('Info Personal','G25','Cónyuge — Sexo','choice',['M','F']),
]},
];

// Dependientes 1-4 (opcional)
(function(){
  const starts=[29,36,43,50];
  const fields=[];
  starts.forEach((r,i)=>{
    const n=i+1;
    fields.push(
      F('Info Personal','C'+r,`Dependiente ${n} — Nombres`),
      F('Info Personal','C'+(r+1),`Dependiente ${n} — Apellidos`),
      F('Info Personal','C'+(r+2),`Dependiente ${n} — Fecha de nacimiento`,'date'),
      F('Info Personal','C'+(r+3),`Dependiente ${n} — Edad`,'number'),
      F('Info Personal','C'+(r+4),`Dependiente ${n} — ¿Es dependiente?`,'choice',['Sí','No']),
      F('Info Personal','G'+r,`Dependiente ${n} — Institución`),
      F('Info Personal','G'+(r+1),`Dependiente ${n} — Nivel`,'choice',['Párvulos','Primaria','Secundaria','Universidad','Postgrado']),
      F('Info Personal','G'+(r+2),`Dependiente ${n} — Año de graduación`,'number'),
      F('Info Personal','G'+(r+3),`Dependiente ${n} — ¿Estudiará fuera del país?`,'choice',['Sí','No'])
    );
  });
  SECTIONS.push({id:'deps',name:'3. Dependientes (opcional)',skippable:true,fields});
})();

// Info Financiera
(function(){
  const fields=[
    F('Info Financiera','B4','Residencia — Dirección'),
    F('Info Financiera','F4','¿Casa propia o alquilada?','choice',['Propia','Alquilada']),
    F('Info Financiera','E6','Residencia — Valor de mercado ($)','money'),
    F('Info Financiera','F6','Residencia — Cuota mensual ($)','money'),
  ];
  for(let i=0;i<5;i++){const r=10+i,n=i+1;
    fields.push(F('Info Financiera','B'+r,`Inmueble ${n} — Tipo (Casa/Lote/Terreno/Otro) — "saltar" si no hay más`,'choice',['Casa','Lote','Terreno','Otro','— no hay —']),
      F('Info Financiera','C'+r,`Inmueble ${n} — Ubicación`),
      F('Info Financiera','D'+r,`Inmueble ${n} — Alquiler mensual ($)`,'money'),
      F('Info Financiera','E'+r,`Inmueble ${n} — Valor de mercado ($)`,'money'),
      F('Info Financiera','G'+r,`Inmueble ${n} — % de participación (0-100)`,'pct'));
  }
  for(let i=0;i<5;i++){const r=19+i,n=i+1;
    fields.push(F('Info Financiera','B'+r,`Vehículo ${n} — Marca — "saltar" si no hay más`),
      F('Info Financiera','C'+r,`Vehículo ${n} — Modelo`),
      F('Info Financiera','D'+r,`Vehículo ${n} — Año del carro`,'number'),
      F('Info Financiera','E'+r,`Vehículo ${n} — A nombre de`),
      F('Info Financiera','F'+r,`Vehículo ${n} — Año de compra`,'number'),
      F('Info Financiera','G'+r,`Vehículo ${n} — Precio de compra ($)`,'money'),
      F('Info Financiera','H'+r,`Vehículo ${n} — Valor de mercado actual ($)`,'money'));
  }
  fields.push(
    F('Info Financiera','C27','Muebles — valor ($)','money'),
    F('Info Financiera','C28','Electrodomésticos — valor ($)','money'),
    F('Info Financiera','C29','Artículos deportivos — valor ($)','money'),
    F('Info Financiera','F27','Obras de arte — valor ($)','money'),
    F('Info Financiera','F28','Joyas — valor ($)','money'),
    F('Info Financiera','F29','Otras posesiones — valor ($)','money'),
    F('Info Financiera','C32','Titular — Años para retirarse','number'),
    F('Info Financiera','G32','Cónyuge — Años para retirarse','number'),
    F('Info Financiera','C33','Titular — Saldo AFP ($)','money'),
    F('Info Financiera','G33','Cónyuge — Saldo AFP ($)','money'),
    F('Info Financiera','C34','Titular — ¿Ya realizó retiro de AFP?','choice',['Sí','No']),
    F('Info Financiera','G34','Cónyuge — ¿Ya realizó retiro de AFP?','choice',['Sí','No']),
    F('Info Financiera','C35','Titular — ¿Ha cotizado 10 años el AFP?','choice',['Sí','No']),
    F('Info Financiera','G35','Cónyuge — ¿Ha cotizado 10 años el AFP?','choice',['Sí','No'])
  );
  for(let i=0;i<5;i++){const r=39+i,n=i+1;
    fields.push(F('Info Financiera','B'+r,`Cuenta bancaria ${n} — Banco / Institución — "saltar" si no hay más`),
      F('Info Financiera','E'+r,`Cuenta ${n} — Saldo planillera ($)`,'money'),
      F('Info Financiera','F'+r,`Cuenta ${n} — Saldo ahorro ($)`,'money'),
      F('Info Financiera','G'+r,`Cuenta ${n} — Saldo corriente ($)`,'money'),
      F('Info Financiera','H'+r,`Cuenta ${n} — País`),
      F('Info Financiera','I'+r,`Cuenta ${n} — Región`));
  }
  for(let i=0;i<5;i++){const r=48+i,n=i+1;
    fields.push(F('Info Financiera','B'+r,`Inversión ${n} — Nombre — "saltar" si no hay más`),
      F('Info Financiera','E'+r,`Inversión ${n} — Sector`),
      F('Info Financiera','F'+r,`Inversión ${n} — Inversión inicial ($)`,'money'),
      F('Info Financiera','G'+r,`Inversión ${n} — Valor actual ($)`,'money'),
      F('Info Financiera','K'+r,`Inversión ${n} — Riesgo`,'choice',['Bajo','Medio','Alto']));
  }
  SECTIONS.push({id:'fin',name:'4. Información Financiera (activos)',fields});
})();

// Seguros
(function(){
  const blocks=[
    {r:5, name:'Gastos Médicos — Titular', sheet:'Seguros', cols:['A','B','C','D','E','F','G','H'],
     labels:['Titular de la póliza','Compañía','Monto asegurado ($)','Deducible ($)','Tipo de seguro','Prima mensual ($)','Prima trimestral ($)','Prima semestral ($)'],
     types:['text','text','money','money','text','money','money','money']},
    {r:11, name:'Gastos Médicos — Cónyuge', sheet:'Seguros', cols:['A','B','C','D','E','F','G','H'],
     labels:['Titular','Compañía','Monto ($)','Deducible ($)','Tipo','Mensual ($)','Trimestral ($)','Semestral ($)'],
     types:['text','text','money','money','text','money','money','money']},
    {r:17, name:'Vida — Protección de Ingresos', sheet:'Seguros', cols:['A','B','C','D','E','F','G','H','K'],
     labels:['Titular','Compañía','Monto ($)','Deducible ($)','Tipo','Mensual ($)','Trimestral ($)','Semestral ($)','Valor de rescate ($)'],
     types:['text','text','money','money','text','money','money','money','money']},
    {r:23, name:'Vida — Deuda', sheet:'Seguros', cols:['A','B','C','D','E','F','G','H','K'],
     labels:['Titular','Compañía','Monto ($)','Deducible ($)','Tipo','Mensual ($)','Trimestral ($)','Semestral ($)','Valor de rescate ($)'],
     types:['text','text','money','money','text','money','money','money','money']},
    {r:29, name:'Daños Residenciales', sheet:'Seguros', cols:['A','B','C','D','E','F','G'],
     labels:['Bien asegurado','Compañía','Monto ($)','Deducible ($)','Mensual ($)','Trimestral ($)','Semestral ($)'],
     types:['text','text','money','money','money','money','money']},
    {r:35, name:'Seguro de Vehículos', sheet:'Seguros', cols:['A','B','C','D','E','F','G'],
     labels:['Vehículo','Compañía','Monto ($)','Deducible ($)','Mensual ($)','Trimestral ($)','Semestral ($)'],
     types:['text','text','money','money','money','money','money']},
  ];
  const fields=[];
  blocks.forEach(b=>{
    for(let i=0;i<2;i++){const r=b.r+i;
      b.cols.forEach((c,j)=>{
        fields.push(F(b.sheet,c+r,`${b.name} (póliza ${i+1}) — ${b.labels[j]}${j===0?' — "saltar" si no hay más':''}`,b.types[j]));
      });
    }
  });
  fields.push(
    F('Seguros','C40','¿Posee testamento?','choice',['Sí','No']),
    F('Seguros','C41','¿Posee sociedad?','choice',['Sí','No']),
    F('Seguros','C42','¿Posee poder?','choice',['Sí','No'])
  );
  SECTIONS.push({id:'seg',name:'5. Seguros',skippable:true,fields});
})();

// Detalle de Deudas
(function(){
  const blocks=[
    {r:5, name:'Préstamo Hipotecario', cols:['A','B','C','D','E','F','G','H','I','J','K'],
     labels:['Banco','Destino','Fecha inicio','Monto inicial ($)','Saldo actual ($)','Tasa nominal (%)','Tasa efectiva (%)','Cuota ($)','Meses contratados','Tipo de garantía','Responsable'],
     types:['text','text','date','money','money','pct','pct','money','number','text','text']},
    {r:12, name:'Préstamo Personal', cols:['A','B','C','D','E','F','G','H','I','J','K'],
     labels:['Banco','Tipo/Destino','Fecha inicio','Monto inicial ($)','Saldo actual ($)','Tasa nominal (%)','Tasa efectiva (%)','Cuota ($)','Meses','Garantía','Responsable'],
     types:['text','text','date','money','money','pct','pct','money','number','text','text']},
    {r:19, name:'Tarjeta de Crédito', cols:['A','B','C','D','E','F','G','H','I','J'],
     labels:['Emisor','Tipo de tarjeta','Límite ($)','Saldo actual ($)','Tasa nominal (%)','Tasa efectiva (%)','Pago mínimo ($)','Monto en mora ($)','Extrafinanciamiento ($)','Responsable'],
     types:['text','text','money','money','pct','pct','money','money','money','text']},
    {r:26, name:'Extrafinanciamiento / Compra a plazos', cols:['A','B','C','D','E','F','G','H','I','J','K'],
     labels:['Emisor','Destino','Fecha inicio','Monto inicial ($)','Saldo actual ($)','Tasa nominal (%)','Tasa efectiva (%)','Cuota ($)','Meses','Responsable','Tipo'],
     types:['text','text','date','money','money','pct','pct','money','number','text','text']},
    {r:33, name:'Préstamo de Vehículo', cols:['A','B','C','D','E','F','G','H','I','J','K'],
     labels:['Emisor','Destino','Fecha inicio','Monto inicial ($)','Saldo actual ($)','Tasa nominal (%)','Tasa efectiva (%)','Cuota ($)','Meses','Garantía','Responsable'],
     types:['text','text','date','money','money','pct','pct','money','number','text','text']},
    {r:40, name:'Otras Deudas', cols:['A','B','C','D','E','F','G','H','I','J','K'],
     labels:['Emisor','Tipo/Destino','Fecha inicio','Monto inicial ($)','Saldo actual ($)','Tasa nominal (%)','Tasa efectiva (%)','Cuota ($)','Meses','Garantía','Responsable'],
     types:['text','text','date','money','money','pct','pct','money','number','text','text']},
  ];
  const fields=[];
  blocks.forEach(b=>{
    for(let i=0;i<3;i++){const r=b.r+i;
      b.cols.forEach((c,j)=>{
        fields.push(F('Detalle de Deudas',c+r,`${b.name} ${i+1} — ${b.labels[j]}${j===0?' — "saltar" si no hay más':''}`,b.types[j]));
      });
    }
  });
  SECTIONS.push({id:'deu',name:'6. Detalle de Deudas',skippable:true,fields});
})();

// Detalle de Ingresos
SECTIONS.push({id:'ding',name:'7. Detalle de Ingresos',fields:[
  F('Detalle de Ingresos','B5','Titular — Sueldo mensual bruto ($)','money'),
  F('Detalle de Ingresos','C5','Cónyuge — Sueldo mensual bruto ($)','money'),
  F('Detalle de Ingresos','B6','Titular — Comisiones mensuales brutas ($)','money'),
  F('Detalle de Ingresos','C6','Cónyuge — Comisiones mensuales brutas ($)','money'),
  F('Detalle de Ingresos','B9','Servicios profesionales — Titular ($/mes)','money'),

/* ============ MOTOR DEL CHATBOT ============ */
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), sendBtn=document.getElementById('send');
const answers={}; // key sheet!cell -> value
let templateWB=null, queue=[], current=null, mode='menu', clientCode='';

function addMsg(text,who){
  const d=document.createElement('div'); d.className='msg '+who; d.textContent=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
}
function addChips(list){
  const w=document.createElement('div'); w.className='chips';
  list.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{inp.value=t;handleSend();};w.appendChild(b);});
  chat.appendChild(w); chat.scrollTop=chat.scrollHeight;
}
function key(f){return f.sheet+'!'+f.cell;}
function totalFields(){return SECTIONS.reduce((a,s)=>a+s.fields.length,0);}
function updateProgress(){
  const pct=Math.round(Object.keys(answers).length/totalFields()*100);
  document.getElementById('progressBar').style.width=pct+'%';
}
function parseVal(f,raw){
  const t=raw.trim();
  if(f.type==='money'||f.type==='number'){
    const n=parseFloat(t.replace(/[$,\s]/g,''));
    if(isNaN(n)) return {err:'Por favor ingresa un número válido (ej. 1500 o 1,500.50).'};
    return {val:n};
  }
  if(f.type==='pct'){
    const n=parseFloat(t.replace(/[%\s,]/g,''));
    if(isNaN(n)) return {err:'Ingresa un porcentaje válido (ej. 50 o 7.5).'};
    return {val:n>1?n/100:n/100===0?0:n<=1&&n>0?n:n/100, display:n+'%'};
  }
  if(f.type==='date'){
    const m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if(!m) return {err:'Usa el formato día/mes/año (ej. 15/03/1990).'};
    let y=+m[3]; if(y<100)y+=1900;
    return {val:`${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${y}`};
  }
  if(f.type==='choice'){
    const hit=f.hint===undefined&&null;
    const opt=(f.opts||[]).find(o=>o.toLowerCase()===t.toLowerCase());
    if(f.opts && !opt) return {err:'Elige una opción: '+f.opts.join(', ')};
    return {val:opt||t};
  }
  return {val:t};
}
function setInputMode(f){
  if(f&&(f.type==='money'||f.type==='number'||f.type==='pct')) inp.inputMode='decimal';
  else if(f&&f.type==='date') inp.inputMode='numeric';
  else inp.inputMode='text';
}
function askNext(){
  if(!queue.length){mode='menu';showMenu('Sección completada ✅ ¿Qué sigue?');
  addChips(['📄 Generar PDF Estado Financiero']);return;}
  current=queue[0];
  const f=current;
  const done=Object.keys(answers).length, tot=totalFields();
  const d=addMsg(`[${done}/${tot}] ${f.label}`,'bot');
  const tag=document.createElement('span');tag.className='fieldtag';
  tag.textContent=`${f.sheet} · celda ${f.cell}`;d.prepend(tag);
  setInputMode(f);
  if(f.type==='choice') addChips([...f.opts,'saltar']);
  else if(f.type==='money'||f.type==='number') addChips(['0','saltar']);
  else addChips(['saltar']);
  inp.focus();
}
function startSection(sec){
  queue=[...sec.fields]; mode='fields';
  addMsg(`Iniciando: ${sec.name} (${sec.fields.length} campos). Escribe "saltar" para omitir un campo o "menú" para volver.`,'bot');
  askNext();
}
function showMenu(title){
  mode='menu';
  addMsg(title||'Elige una sección para comenzar:','bot');
  addChips(SECTIONS.map(s=>{
    const done=s.fields.filter(f=>answers[key(f)]!==undefined).length;
    return `${s.name} (${done}/${s.fields.length})`;
  }));
  addChips(['📊 Resumen de lo capturado']);
}
function handleSend(){
  const raw=inp.value.trim(); if(!raw)return;
  inp.value=''; addMsg(raw,'user');
  const low=raw.toLowerCase();
  if(low==='menú'||low==='menu'){queue=[];current=null;showMenu();return;}
  if(low==='resumen'||low==='📊 resumen de lo capturado'){showSummary();return;}
  if(low==='📄 generar pdf estado financiero'){generatePDF();return;}
  if(mode==='clientcode'){
    clientCode=raw;
    answers['Info Personal!F1']=clientCode;
    if(!answers['Info Personal!F2']){
      const d=new Date();
      answers['Info Personal!F2']=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }
    updateProgress();
    addMsg(`✅ Número de cliente registrado: ${clientCode}. Fecha de hoy asignada automáticamente.`,'sys');
    showMenu('Perfecto. Ahora elige por dónde empezar:');
    return;
  }
  if(mode==='menu'){
    const idx=SECTIONS.findIndex(s=>raw.startsWith(s.name)||raw.includes(s.name));
    if(idx>=0){
      const s=SECTIONS[idx];
      if(s.skippable){
        addMsg('Esta sección es opcional. ¿Deseas llenarla?','bot');
        addChips(['Sí, llenar','No, omitir sección']);
        const wait=(txt)=>{};
        pendingConfirm=idx; mode='confirm'; return;
      }
      startSection(s); return;
    }
    addMsg('No reconocí la sección. Elige una del menú.','bot'); showMenu(''); return;
  }
  if(mode==='confirm'){
    const s=SECTIONS[pendingConfirm];
    if(low.startsWith('s')) startSection(s);
    else { addMsg(`Sección "${s.name}" omitida.`,'sys'); showMenu(); }
    return;
  }
  if(mode==='fields'&&current){
    if(low==='saltar'){queue.shift();askNext();return;}
    const f=current;
    const r=parseVal(f,raw);
    if(r.err){addMsg('⚠️ '+r.err,'bot');return;}
    answers[key(f)]=r.val; updateProgress();
    queue.shift(); askNext();
  }
}
let pendingConfirm=null;
function showSummary(){
  const n=Object.keys(answers).length;
  if(!n){addMsg('Aún no has capturado datos.','bot');return;}
  const bySheet={};
  Object.entries(answers).forEach(([k,v])=>{const s=k.split('!')[0];bySheet[s]=(bySheet[s]||0)+1;});
  let txt=`📊 Resumen: ${n} campos capturados de ${totalFields()}.\n`;
  Object.entries(bySheet).forEach(([s,c])=>txt+=`• ${s}: ${c} campos\n`);
  txt+='\nUsa los botones de arriba para descargar el Excel llenado, exportar CSV/JSON o generar el 📄 PDF de estado financiero para el cliente.';
  addMsg(txt,'bot');
}

/* ============ EXPORTACIÓN ============ */
document.getElementById('btnUpload').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=async e=>{
  const file=e.target.files[0]; if(!file)return;
  const buf=await file.arrayBuffer();
  templateWB=new ExcelJS.Workbook();
  await templateWB.xlsx.load(buf); // conserva estilos, colores, bordes y fórmulas originales
  addMsg(`📂 Plantilla cargada: ${file.name}. Las respuestas se escribirán sobre ella conservando su diseño.`,'sys');
};
document.getElementById('btnExcel').onclick=async ()=>{
  if(!templateWB){addMsg('⚠️ Primero carga la plantilla (.xlsx) con el botón "Cargar plantilla".','bot');return;}
  if(!Object.keys(answers).length){addMsg('⚠️ No hay datos capturados todavía.','bot');return;}
  Object.entries(answers).forEach(([k,v])=>{
    const [sheet,cell]=k.split('!');
    const ws=templateWB.getWorksheet(sheet); if(!ws)return;
    const c=ws.getCell(cell);
    c.value=v; // ExcelJS mantiene el estilo original de la celda (amarillo, bordes, fuente)
    if(typeof v==='number') c.numFmt='$#,##0.00';
  });
  const buf=await templateWB.xlsx.writeBuffer();
  download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`FP_Plantilla_PWM_${clientCode||'llenado'}.xlsx`);
  addMsg('✅ Excel descargado con el diseño original de la plantilla (colores, fórmulas y formatos intactos).','bot');
};
document.getElementById('btnCSV').onclick=()=>{
  if(!Object.keys(answers).length){addMsg('⚠️ No hay datos capturados todavía.','bot');return;}
  let csv='Hoja,Celda,Valor\n';
  Object.entries(answers).forEach(([k,v])=>{
    const [s,c]=k.split('!'); csv+=`"${s}","${c}","${String(v).replace(/"/g,'""')}"\n`;
  });
  download(new Blob([csv],{type:'text/csv'}),'respuestas_pwm.csv');
  download(new Blob([JSON.stringify(answers,null,2)],{type:'application/json'}),'respuestas_pwm.json');
  addMsg('✅ CSV y JSON descargados.','bot');
};

function sumCells(list){let t=0;list.forEach(k=>{const v=answers[k];if(typeof v==='number')t+=v;});return t;}
function rng(sheet,col,a,b){const out=[];for(let r=a;r<=b;r++)out.push(sheet+'!'+col+r);return out;}
function computeSummary(){
  const activos = sumCells(['Info Financiera!E6'])
    + sumCells(rng('Info Financiera','E',10,14))      // inmuebles valor mercado
    + sumCells(rng('Info Financiera','H',19,23))      // vehículos valor actual
    + sumCells(['Info Financiera!C27','Info Financiera!C28','Info Financiera!C29','Info Financiera!F27','Info Financiera!F28','Info Financiera!F29']) // posesiones
    + sumCells(['Info Financiera!C33','Info Financiera!G33']) // AFP
    + sumCells(rng('Info Financiera','E',39,43))+sumCells(rng('Info Financiera','F',39,43))+sumCells(rng('Info Financiera','G',39,43)) // bancos
    + sumCells(rng('Info Financiera','G',48,52));     // inversiones valor actual
  const pasivos = sumCells(rng('Detalle de Deudas','E',5,7))   // hipotecario saldo
    + sumCells(rng('Detalle de Deudas','E',12,14))             // personal saldo
    + sumCells(rng('Detalle de Deudas','D',19,21))             // tarjeta saldo
    + sumCells(rng('Detalle de Deudas','E',26,28))             // extrafinanciamiento
    + sumCells(rng('Detalle de Deudas','E',33,35))             // vehículo
    + sumCells(rng('Detalle de Deudas','E',40,42));            // otras
  const ingreso = sumCells(rng('Ingresos y Gastos','C',6,15))+sumCells(rng('Ingresos y Gastos','D',6,15));
  const gasto = sumCells(rng('Ingresos y Gastos','C',19,33))+sumCells(rng('Ingresos y Gastos','C',36,41))
    + sumCells(rng('Ingresos y Gastos','C',44,49))+sumCells(rng('Ingresos y Gastos','C',52,57))
    + sumCells(rng('Ingresos y Gastos','C',60,63))+sumCells(rng('Ingresos y Gastos','G',7,11))
    + sumCells(rng('Ingresos y Gastos','G',14,15))+sumCells(rng('Ingresos y Gastos','G',18,22))
    + sumCells(rng('Ingresos y Gastos','G',25,29))+sumCells(rng('Ingresos y Gastos','G',32,44))
    + sumCells(rng('Ingresos y Gastos','G',47,50));
  return {activos,pasivos,patrimonio:activos-pasivos,ingreso,gasto,disponible:ingreso-gasto};
}
function money(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function generatePDF(){
  if(!Object.keys(answers).length){addMsg('⚠️ No hay datos capturados todavía.','bot');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'letter'});
  const W=doc.internal.pageSize.getWidth();
  // Paleta exacta de la plantilla FP_Plantilla_PWM
  const SLATE=[31,41,55], ORANGE=[232,114,12], GREY=[127,127,127], LIGHT=[243,244,246];
  const cliente=(answers['Info Personal!C7']||'')+' '+(answers['Info Personal!C8']||'');
  const fecha=answers['Info Personal!F2']||new Date().toLocaleDateString('es-SV');
  const codigo=answers['Info Personal!F1']||'—';
  // Encabezado estilo plantilla: banda slate + título blanco
  doc.setFillColor(...SLATE); doc.rect(0,0,W,26,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Resumen Ejecutivo',14,11);
  doc.setFontSize(12); doc.text('PLATINUM WEALTH MANAGEMENT',W-14,11,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(200,205,214);
  doc.text('Panorama de una página para la primera reunión con el cliente',14,19);
  // Cliente / Fecha (como fila 3 de la hoja)
  doc.setTextColor(...SLATE); doc.setFontSize(10);
  doc.setFont('helvetica','bold'); doc.text('Cliente:',14,34);
  doc.setFont('helvetica','normal'); doc.text(cliente.trim()||'—',32,34);
  doc.setFont('helvetica','bold'); doc.text('Código:',14,40);
  doc.setFont('helvetica','normal'); doc.text(String(codigo),32,40);
  doc.setFont('helvetica','bold'); doc.text('Fecha:',W-60,34);
  doc.setFont('helvetica','normal'); doc.text(String(fecha),W-45,34);
  doc.setDrawColor(...ORANGE); doc.setLineWidth(1); doc.line(14,44,W-14,44);
  // KPIs estilo plantilla: etiqueta gris pequeña + valor grande slate
  const s=computeSummary();
  function kpiBlock(x,y,label,value,accent){
    doc.setFillColor(...LIGHT); doc.roundedRect(x,y,58,16,1.5,1.5,'F');
    if(accent){doc.setFillColor(...accent); doc.rect(x,y,2,16,'F');}
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...GREY);
    doc.text(label,x+5,y+5.5);
    doc.setFontSize(13); doc.setTextColor(...SLATE);
    doc.text(value,x+5,y+12.5);
  }
  const col=[14,79,144];
  kpiBlock(col[0],50,'TOTAL ACTIVOS',money(s.activos),SLATE);
  kpiBlock(col[1],50,'TOTAL PASIVOS',money(s.pasivos),SLATE);
  kpiBlock(col[2],50,'PATRIMONIO NETO',money(s.patrimonio),ORANGE);
  kpiBlock(col[0],70,'INGRESO MENSUAL',money(s.ingreso),SLATE);
  kpiBlock(col[1],70,'GASTO MENSUAL',money(s.gasto),SLATE);
  kpiBlock(col[2],70,'DISPONIBLE MENSUAL',money(s.disponible),ORANGE);
  let y=92;
  if(s.ingreso>0){
    const ahorro=s.disponible/s.ingreso*100;
    const endeud=(sumCells(rng('Ingresos y Gastos','G',7,11))+(answers['Ingresos y Gastos!C19']||0)+(answers['Ingresos y Gastos!C44']||0))/s.ingreso*100;
    const liquidez=s.gasto>0?((sumCells(rng('Info Financiera','E',39,43))+sumCells(rng('Info Financiera','F',39,43))+sumCells(rng('Info Financiera','G',39,43)))/s.gasto):0;
    kpiBlock(col[0],y,'TASA DE AHORRO',ahorro.toFixed(1)+'%');
    kpiBlock(col[1],y,'LIQUIDEZ (MESES)',liquidez.toFixed(1));
    kpiBlock(col[2],y,'ENDEUDAMIENTO',endeud.toFixed(1)+'%');
    y+=20;
  }
  // Meta financiera si existe
  if(answers['Meta Financiera!B5']){
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...ORANGE);
    doc.text('Meta Financiera',14,y+4);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...SLATE);
    const meta=`Objetivo: ${answers['Meta Financiera!B5']}  ·  Monto: ${money(answers['Meta Financiera!B6']||0)}  ·  Plazo: ${answers['Meta Financiera!B7']||'—'} años  ·  Tasa esperada: ${((answers['Meta Financiera!B8']||0)*100).toFixed(1)}%`;
    doc.text(meta,14,y+10); y+=14;
  }
  // Detalle por sección
  SECTIONS.forEach(sec=>{
    if(sec.id==='meta')return; // ya se muestra como destacado arriba
    const rows=sec.fields.filter(f=>answers[key(f)]!==undefined)
      .map(f=>{let v=answers[key(f)];
        if(typeof v==='number'&&(f.type==='money'))v=money(v);
        else if(f.type==='pct'&&typeof v==='number')v=(v*100).toFixed(2)+'%';
        return [f.label.replace(/ — "saltar" si no hay más/,''),String(v),f.cell];});
    if(!rows.length)return;
    if(y>240){doc.addPage();y=20;}
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...ORANGE);
    doc.text(sec.name,14,y+4);
    doc.setDrawColor(...ORANGE); doc.setLineWidth(0.5); doc.line(14,y+6,60,y+6);
    doc.autoTable({startY:y+8,margin:{left:14,right:14},theme:'striped',
      head:[['Campo','Valor','Celda']],body:rows,
      headStyles:{fillColor:SLATE,fontSize:8},bodyStyles:{fontSize:8},
      alternateRowStyles:{fillColor:LIGHT},
      columnStyles:{0:{cellWidth:110},1:{cellWidth:50},2:{cellWidth:20,halign:'center'}}});
    y=doc.lastAutoTable.finalY+6;
  });
  // Pie
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(...GREY);
    doc.text(`Documento generado por el Asistente PWM · Página ${i} de ${pages}`,W/2,doc.internal.pageSize.getHeight()-8,{align:'center'});}
  const fname=`Estado_Financiero_${clientCode||'PWM'}_${(cliente.trim()||'Cliente').replace(/\s+/g,'_')}.pdf`;
  doc.save(fname);
  addMsg('📄 PDF generado: '+fname,'bot');
}
document.getElementById('btnPDF').onclick=generatePDF;
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
sendBtn.onclick=handleSend;
document.getElementById('menuBtn').onclick=()=>document.getElementById('menuPanel').classList.toggle('open');
document.getElementById('btnDark').onclick=function(){
  document.body.classList.toggle('dark');
  const d=document.body.classList.contains('dark');
  this.textContent=d?'☀️ Modo claro':'🌙 Modo oscuro';
  try{localStorage.setItem('pwm_dark',d?'1':'0');}catch(e){}
};
try{if(localStorage.getItem('pwm_dark')==='1'){document.body.classList.add('dark');document.getElementById('btnDark').textContent='☀️ Modo claro';}}catch(e){}
setTimeout(()=>{const s=document.getElementById('splash');if(s)s.classList.add('hide');},2400);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')handleSend();});

/* ============ INICIO ============ */
async function loadEmbeddedTemplate(){
  try{
    const bin=atob(TEMPLATE_B64);
    const buf=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
    templateWB=new ExcelJS.Workbook();
    await templateWB.xlsx.load(buf.buffer);
    addMsg('✅ Plantilla FP_Plantilla_PWM cargada y lista (diseño original conservado).','sys');
  }catch(e){addMsg('⚠️ No se pudo cargar la plantilla incrustada. Usa el botón "Cargar plantilla".','bot');}
}
(async function init(){
  addMsg('¡Hola! Soy el asistente de Platinum Wealth Management para completar tu Estado Financiero Personal. Te haré preguntas una por una; al final recibirás el Excel llenado y un PDF con tu estado financiero.','bot');
  await loadEmbeddedTemplate();
  addMsg('💡 Consejos:\n• Escribe "saltar" para omitir cualquier campo.\n• Escribe "menú" para cambiar de sección.\n• Escribe "resumen" para ver tu avance.','bot');
  addMsg('Para comenzar, ¿cuál es tu número de cliente?','bot');
  mode='clientcode'; inp.inputMode='numeric'; inp.focus();
})();
</script>
